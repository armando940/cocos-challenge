services:
  # PostgreSQL Local para desarrollo
  postgres:
    image: postgres:16-alpine
    container_name: cocos-postgres
    environment:
      POSTGRES_DB: cocos_challenge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cocos_challenge"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cocos-network

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: cocos-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - cocos-network

  # Grafana para dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: cocos-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cocos-network

  # Aplicación (se levanta con ./gradlew bootRun o docker build)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cocos-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cocos_challenge
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://jaeger:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - cocos-network

  # Jaeger para tracing distribuido (opcional, stretch)
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: cocos-jaeger
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - cocos-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  cocos-network:
    driver: bridge