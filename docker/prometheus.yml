global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'cocos-challenge-local'
    environment: 'development'

scrape_configs:
  # Spring Boot Actuator / Prometheus endpoint
  - job_name: 'cocos-challenge'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'cocos-challenge'
          profile: 'local'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL exporter (opcional, si se agrega)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Node exporter (opcional)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

